--- 
- name: Install Python 3 and pip 
  ansible.builtin.yum: 
  name: 
  - python3 
  - python3-pip 
  state: present 
 
- name: Install Flask app dependencies 
  ansible.builtin.pip: 
 # app_base_path is defined in the main deploy.yml playbook 
  requirements: "{{ app_base_path }}/requirements.txt" 
  virtualenv: "{{ app_base_path }}/venv"
