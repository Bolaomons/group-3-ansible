---
- name: Ensure app user exists
  become: true
  user:
    name: "{{ app_user }}"
    state: present
    shell: /bin/bash

- name: Create base application directory
  become: true
  file:
    path: "{{ app_base_path }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Ensure venv tooling is present (Ubuntu/Debian)
  become: true
  apt:
    name: python3-venv
    state: present
    update_cache: yes

- name: Create virtualenv
  become: true
  command: python3 -m venv "{{ venv_path }}"
  args:
    creates: "{{ venv_path }}/bin/activate"

- name: Unarchive app artifact (path is on the TARGET because remote_src: true)
  become: true
  unarchive:
    src: "{{ app_artifact_path }}"
    dest: "{{ app_base_path }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    extra_opts:
      - --strip-components=1

- name: Check for requirements.txt
  stat:
    path: "{{ app_base_path }}/requirements.txt"
  register: reqfile

- name: Install dependencies from requirements.txt (if present)
  become: true
  pip:
    requirements: "{{ app_base_path }}/requirements.txt"
    virtualenv: "{{ venv_path }}"
    virtualenv_command: python3 -m venv
  when: reqfile.stat.exists

- name: Install Flask and Gunicorn into venv (fallback)
  become: true
  pip:
    name:
      - flask
      - gunicorn
    virtualenv: "{{ venv_path }}"
    virtualenv_command: python3 -m venv
  when: not reqfile.stat.exists

- name: Install systemd unit
  become: true
  template:
    src: flask_app.service.j2
    dest: /etc/systemd/system/flask_app.service
    mode: "0644"

- name: Reload, enable and start service
  become: true
  systemd:
    name: flask_app
    daemon_reload: true
    enabled: true
    state: started