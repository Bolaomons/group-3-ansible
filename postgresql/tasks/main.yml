---
# Install & configure PostgreSQL on Debian/Ubuntu or RedHat/Amazon

# Debian/Ubuntu branch
- block:
    - name: Debian | install PostgreSQL
      become: true
      apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: yes
        force_apt_get: yes

    - name: Debian | ensure service running
      become: true
      service:
        name: postgresql
        state: started
        enabled: true
  when: ansible_facts.os_family == "Debian"

# RedHat/Amazon branch (covers RHEL, Rocky, Alma, Amazon Linux)
- block:
    # Amazon Linux 2 has modular packages via amazon-linux-extras (e.g., postgresql14)
    - block:
        - name: Amazon Linux 2 | enable postgres14 extras (idempotent best-effort)
          become: true
          command: amazon-linux-extras enable postgresql14
          args:
            creates: /etc/yum.repos.d/amzn2-extras.repo
          changed_when: false
          failed_when: false

        - name: Amazon Linux 2 | install PostgreSQL 14
          become: true
          yum:
            name:
              - postgresql14
              - postgresql14-server
            state: present

        - name: Amazon Linux 2 | initdb if needed
          become: true
          command: /usr/pgsql-14/bin/postgresql-setup initdb
          args:
            creates: /var/lib/pgsql/14/data/PG_VERSION

        - name: Amazon Linux 2 | ensure service running
          become: true
          service:
            name: postgresql-14
            state: started
            enabled: true
      when: ansible_facts.distribution == "Amazon" and
            ansible_facts.distribution_major_version | int == 2

    # Amazon Linux 2023 / RHEL / Rocky / Alma use dnf + postgresql-server
    - block:
        - name: RedHat | install PostgreSQL server
          become: true
          dnf:
            name:
              - postgresql-server
              - postgresql
            state: present

        - name: RedHat | initdb if needed
          become: true
          command: /usr/bin/postgresql-setup --initdb
          args:
            creates: /var/lib/pgsql/data/PG_VERSION

        - name: RedHat | ensure service running
          become: true
          service:
            name: postgresql
            state: started
            enabled: true
      when: not (ansible_facts.distribution == "Amazon" and
                 ansible_facts.distribution_major_version | int == 2)
  when: ansible_facts.os_family == "RedHat"

# Common: locate pg_hba.conf and ensure localhost rule
- name: Find pg_hba.conf (any platform)
  become: true
  find:
    paths:
      - /postgresql
      - /var/lib/pgsql
    patterns: pg_hba.conf
    recurse: true
  register: pg_hba

# If file exists, edit it; else create a default for Debian 14 path (adjusts on AL2 above)
- name: Ensure localhost rule in pg_hba.conf (if present)
  become: true
  lineinfile:
    path: "{{ pg_hba.files[0].path }}"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+\w+'
    line: 'host all all 127.0.0.1/32 md5'
    backrefs: true
  when: pg_hba.matched > 0
  notify: Restart postgresql

- name: Create pg_hba.conf for Debian default if missing (rare)
  become: true
  template:
    src: pg_hba.conf.j2
    dest: "/postgresql/{{ postgresql_version | default('14') }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  when: pg_hba.matched == 0 and ansible_facts.os_family == "Debian"
  notify: Restart postgresql
