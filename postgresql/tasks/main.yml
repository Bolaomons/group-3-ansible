---
- name: Debian | bootstrap python3-apt if needed
  become: true
  raw: |
    test -x /usr/bin/apt-get && (apt-get update -y || apt-get update) && apt-get install -y python3-apt
  changed_when: false
  failed_when: false

- name: Install PostgreSQL
  become: true
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present
    update_cache: yes

- name: Ensure PostgreSQL is enabled and running
  become: true
  service:
    name: postgresql
    state: started
    enabled: true

- name: Locate pg_hba.conf
  become: true
  find:
    paths: /etc/postgresql
    patterns: pg_hba.conf
    recurse: yes
  register: pg_hba

- name: Create pg_hba.conf from template if missing
  become: true
  template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgresql_version | default('14') }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  when: pg_hba.matched == 0
  notify: Restart postgresql
  
- name: Allow local connections in pg_hba.conf
  become: true
  lineinfile:
    path: "{{ pg_hba.files[0].path }}"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+\w+'
    line: 'host all all 127.0.0.1/32 trust'
    backrefs: yes
  when: pg_hba.matched > 0
  notify: Restart postgresql