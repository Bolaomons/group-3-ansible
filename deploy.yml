# deploy.yml
---
- name: Configure PostgreSQL on DB host(s)
  hosts: db_server
  become: true
  roles:
    - postgresql

- name: Prepare Python and deploy Flask app on App host(s)
  hosts: app_server
  become: true
  vars:
    app_base_path: /opt/flask-app
    # Define if you aren't passing it from Jenkins:
    # app_artifact_path: /tmp/app.tar.gz
  roles:
    - python-flask
    - flask-deploy
